services:
  app:
    build: .
    ports:
      - "3001:3001"
    container_name: email-forwarder
    restart: always
    environment:
      - TZ=${TZ}
      - IMAP_SERVER=${IMAP_SERVER}
      - IMAP_PORT=${IMAP_PORT}
      - IMAP_USER=${IMAP_USER}
      - IMAP_PASSWORD=${IMAP_PASSWORD}
      - API_URL=${API_URL}
      - RECIPIENT_ID=${RECIPIENT_ID}
      - API_KEY=${API_KEY}
